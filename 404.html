<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#171727">
  <title>Page not found · FUJI Operations</title>
  <style>
    :root{color-scheme:light;--ink:#171727;--muted:#69687b;--accent:#6754e8;--paper:#fff;--canvas:#f6f5fa}
    *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 10% 0%,#e9e5ff 0,transparent 36%),var(--canvas);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(680px,100%);padding:clamp(28px,7vw,64px);border:1px solid #e4e1ef;border-radius:28px;background:rgba(255,255,255,.88);box-shadow:0 28px 90px #251d4e16;text-align:center}
    .mark{display:grid;width:58px;height:58px;place-items:center;margin:0 auto 24px;border-radius:19px;background:linear-gradient(135deg,#7866ef,#4d3acb);color:#fff;font-size:30px;font-weight:800}
    .code{margin:0;color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.18em}h1{margin:12px 0;font-size:clamp(34px,7vw,58px);letter-spacing:-.05em}p{max-width:460px;margin:0 auto;color:var(--muted);line-height:1.7}
    .actions{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:28px}.actions a{display:inline-flex;min-height:46px;align-items:center;justify-content:center;padding:0 19px;border:1px solid #dedbea;border-radius:999px;background:#fff;color:#36334c;font-size:14px;font-weight:700;text-decoration:none;transition:transform .16s ease,background .16s ease}.actions a:first-child{border-color:var(--accent);background:var(--accent);color:#fff}.actions a:hover{transform:translateY(-2px)}.foot{margin-top:36px;font-size:11px;font-weight:700;letter-spacing:.12em}
    @media(prefers-color-scheme:dark){:root{color-scheme:dark;--ink:#f1effa;--muted:#aaa9bb;--paper:#191a27;--canvas:#11121c}body{background:radial-gradient(ellipse at 10% 0%,#27213b 0,transparent 36%),var(--canvas)}main{border-color:#343547;background:rgba(25,26,39,.92)}.actions a{border-color:#343547;background:#191a27;color:#f1effa}}
  </style>
</head>
<body><main><div class="mark" aria-hidden="true">F</div><p class="code">ERROR 404 · WRONG AISLE</p><h1>This page took a wrong turn.</h1><p>The link may have moved, or the page may no longer be here. Head back to the operations desk and keep your workflow moving.</p><div class="actions"><a href="/">Back to FUJI workspace</a><a href="/">Return home</a></div><p class="foot">FUJI CYCLE COUNT SYSTEM</p></main></body>
</html>
