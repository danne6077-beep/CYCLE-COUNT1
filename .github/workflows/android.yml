name: FUJI Android APK
on:
  push:
    branches: ['codex/fuji-shopper-hypermart']
    paths: ['android/**', 'shopper/catalog/**', 'scripts/build-android-catalog.mjs', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fuji-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - name: Verify shared catalog and install build SDK
        run: |
          node scripts/build-android-catalog.mjs
          git diff --exit-code -- android/app/src/main/assets
          sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
          chmod +x android/gradlew
      - name: Build, unit tests and lint
        working-directory: android
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug assembleDebugAndroidTest --console plain
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real offline repository and Compose shopping flow
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: |
            adb shell svc wifi disable
            adb shell svc data disable
            cd android && ./gradlew connectedDebugAndroidTest --console plain
      - name: Package APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk FUJI-Grocery-Tracker.apk
          sha256sum FUJI-Grocery-Tracker.apk > FUJI-Grocery-Tracker.apk.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fuji-android-review
          path: |
            FUJI-Grocery-Tracker.apk
            FUJI-Grocery-Tracker.apk.sha256
            android/app/build/reports
            android/app/build/outputs/androidTest-results
  publish-review-apk:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download validated APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download '${{ github.run_id }}' --name fuji-android-review --dir review-artifact
      - name: Publish downloadable review APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view fuji-android-review > /dev/null 2>&1; then
            gh release upload fuji-android-review review-artifact/FUJI-Grocery-Tracker.apk review-artifact/FUJI-Grocery-Tracker.apk.sha256 --clobber
          else
            gh release create fuji-android-review review-artifact/FUJI-Grocery-Tracker.apk review-artifact/FUJI-Grocery-Tracker.apk.sha256 --prerelease --target "$GITHUB_SHA" --title 'FUJI Grocery Tracker — Android review APK' --notes-file android/release-notes.md
          fi
