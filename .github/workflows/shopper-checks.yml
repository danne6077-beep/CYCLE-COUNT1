name: Shopper checks
on:
  pull_request:
    paths: ['shopper/**', 'api/**', 'server/**', 'firestore.rules', 'scripts/**', 'vercel.json']
  push:
    branches: ['codex/fuji-shopper-hypermart']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - run: pnpm --dir shopper install --no-frozen-lockfile
      - run: pnpm --dir shopper lint
      - run: pnpm --dir shopper typecheck
      - run: node --test
      - run: node scripts/build_pages.js
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Mobile browser flow
        run: |
          node shopper/scripts/serve.mjs > /tmp/fuji-preview.log 2>&1 &
          node scripts/shopper-smoke.cjs
          node scripts/shopper-swap-check.cjs
          node scripts/shopper-offline-check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shopper-proof
          path: |
            qa/shopper
            docs/shopper-build-report.json
